// ─── TIMER ──────────────────────────────────────────────────────────────────
function Timer({seconds, onDone}) {
  const [left, setLeft]     = useState(seconds);
  const [running, setRunning] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (running && left > 0) {
      ref.current = setInterval(() => setLeft(l => {
        if (l <= 1) { clearInterval(ref.current); setRunning(false); onDone?.(); return 0; }
        return l - 1;
      }), 1000);
    }
    return () => clearInterval(ref.current);
  }, [running]);
  const pct = ((seconds - left) / seconds) * 100;
  const clr = left > seconds * 0.5 ? "#22c55e" : left > seconds * 0.2 ? "#f97316" : "#ef4444";
  return e('div', {style:{textAlign:'center',padding:'8px 0'}},
    e('svg', {width:80,height:80,viewBox:'0 0 80 80'},
      e('circle',{cx:40,cy:40,r:34,fill:'none',stroke:'#e5e7eb',strokeWidth:6}),
      e('circle',{cx:40,cy:40,r:34,fill:'none',stroke:clr,strokeWidth:6,
        strokeDasharray:`${2*Math.PI*34}`,
        strokeDashoffset:`${2*Math.PI*34*(1-pct/100)}`,
        strokeLinecap:'round',
        style:{transform:'rotate(-90deg)',transformOrigin:'center',transition:'stroke-dashoffset 0.9s'}}),
      e('text',{x:40,y:46,textAnchor:'middle',fontSize:18,fontWeight:'bold',fill:'#1f2937'},
        left < 60 ? `${left}s` : `${Math.ceil(left/60)}m`)
    ),
    e('div',{style:{display:'flex',gap:8,justifyContent:'center',marginTop:6}},
      e('button',{
        onClick:()=>{ if(!running&&left>0) setRunning(true); else { clearInterval(ref.current); setRunning(false); } },
        style:{background:running?'#ef4444':'#22c55e',color:'#fff',border:'none',borderRadius:20,padding:'6px 18px',fontWeight:'bold',fontSize:14,cursor:'pointer'}
      }, running ? '⏸ Pause' : left===0 ? '✓ Fertig' : '▶ Start'),
      e('button',{
        onClick:()=>{ clearInterval(ref.current); setRunning(false); setLeft(seconds); },
        style:{background:'#e5e7eb',color:'#374151',border:'none',borderRadius:20,padding:'6px 12px',fontSize:14,cursor:'pointer'}
      },'↺')
    )
  );
}

// ─── WORKOUT SCREEN (guided) ─────────────────────────────────────────────────
function WorkoutScreen({day, onBack}) {
  const [phase, setPhase]       = useState('warmup');
  const [exIdx, setExIdx]       = useState(0);
  const [setIdx, setSetIdx]     = useState(0);
  const [resting, setResting]   = useState(false);
  const [showDet, setShowDet]   = useState(false);

  const ex     = day.exercises[exIdx];
  const total  = day.exercises.length;
  const prog   = Math.round(((exIdx + setIdx/(ex?.sets||1)) / total) * 100);

  function nextSet() {
    setShowDet(false);
    if (setIdx + 1 < ex.sets) {
      setSetIdx(s => s+1);
      if (ex.rest > 0) setResting(true);
    } else if (exIdx + 1 < total) {
      setExIdx(i => i+1); setSetIdx(0); setResting(false);
    } else {
      setPhase('cooldown');
    }
  }

  if (phase === 'done') return e('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100%',gap:16,padding:24}},
    e('div',{style:{fontSize:64}},'🏆'),
    e('div',{style:{fontSize:22,fontWeight:'bold',color:'#1f2937'}},'Einheit abgeschlossen!'),
    e('div',{style:{fontSize:14,color:'#6b7280',marginTop:4}},day.full+' · '+day.focus),
    e('button',{onClick:onBack,style:{marginTop:20,background:day.color,color:'#fff',border:'none',borderRadius:24,padding:'12px 32px',fontSize:16,fontWeight:'bold',cursor:'pointer'}},'← Zurück')
  );

  return e('div',{style:{display:'flex',flexDirection:'column',height:'100%',background:'#fff'}},
    // Header
    e('div',{style:{background:day.color,color:'#fff',padding:'12px 16px',display:'flex',alignItems:'center',gap:12,flexShrink:0}},
      e('button',{onClick:onBack,style:{background:'rgba(255,255,255,0.2)',border:'none',color:'#fff',borderRadius:20,padding:'4px 12px',cursor:'pointer',fontSize:15}},'←'),
      e('div',{style:{flex:1}},
        e('div',{style:{fontWeight:'bold',fontSize:15}}, day.icon+' '+day.full+' – Geführt'),
        e('div',{style:{fontSize:12,opacity:0.85}}, day.focus)
      ),
      e('div',{style:{fontSize:13,opacity:0.9}}, day.duration+' Min')
    ),
    // Progress
    phase==='exercise' && e('div',{style:{height:4,background:'#e5e7eb',flexShrink:0}},
      e('div',{style:{height:'100%',background:day.color,width:prog+'%',transition:'width 0.3s'}})
    ),
    // Body
    e('div',{className:'scroll',style:{padding:16}},
      // WARMUP
      phase==='warmup' && e('div',null,
        e('div',{style:{fontSize:18,fontWeight:'bold',marginBottom:12}},'🔆 Aufwärmen'),
        day.warmup.length===0
          ? e('p',{style:{color:'#6b7280'}},'Kein separates Aufwärmen – direkt loslegen.')
          : day.warmup.map((w,i)=>e('div',{key:i,style:{background:'#f3f4f6',borderRadius:10,padding:'10px 14px',marginBottom:8,fontSize:14,color:'#374151'}},'• '+w)),
        e('button',{onClick:()=>setPhase('exercise'),style:{width:'100%',marginTop:12,background:day.color,color:'#fff',border:'none',borderRadius:14,padding:14,fontSize:16,fontWeight:'bold',cursor:'pointer'}},'Übungen starten →')
      ),
      // EXERCISE – resting
      phase==='exercise' && resting && e('div',{style:{textAlign:'center',paddingTop:20}},
        e('div',{style:{fontSize:18,fontWeight:'bold',marginBottom:4}},'Pause'),
        e('div',{style:{fontSize:14,color:'#6b7280',marginBottom:12}},'Weiter: '+ex.name+' · Satz '+(setIdx+1)+'/'+ex.sets),
        e(Timer,{seconds:ex.rest,onDone:()=>setResting(false)}),
        e('button',{onClick:()=>setResting(false),style:{marginTop:12,background:'none',border:'none',color:'#6b7280',fontSize:14,cursor:'pointer'}},'Überspringen →')
      ),
      // EXERCISE – active
      phase==='exercise' && !resting && ex && e('div',null,
        e('div',{style:{fontSize:12,color:'#6b7280',marginBottom:4}},'Übung '+(exIdx+1)+' / '+total),
        e('div',{style:{fontSize:22,fontWeight:'bold',color:'#1f2937',marginBottom:8}},ex.name),
        e('div',{style:{display:'flex',gap:8,flexWrap:'wrap',marginBottom:12}},
          e('span',{style:{background:day.light,color:day.color,border:'1px solid '+day.border,borderRadius:20,padding:'3px 10px',fontSize:13,fontWeight:'bold'}},'Satz '+(setIdx+1)+'/'+ex.sets),
          e('span',{style:{background:'#f3f4f6',color:'#374151',borderRadius:20,padding:'3px 10px',fontSize:13}},ex.reps),
          ex.weight!=='–' && e('span',{style:{background:'#fef3c7',color:'#92400e',borderRadius:20,padding:'3px 10px',fontSize:13}},'⚖️ '+ex.weight)
        ),
        DETAILS[ex.name] && e('div',{style:{marginBottom:12}},
          e('button',{onClick:()=>setShowDet(d=>!d),style:{background:'none',border:'1px solid '+day.color,color:day.color,borderRadius:20,padding:'5px 14px',fontSize:13,cursor:'pointer'}},
            showDet ? '▲ Weniger' : 'ℹ️ Ausführung'),
          showDet && e('div',{style:{marginTop:8,background:'#f9fafb',borderRadius:12,padding:12,fontSize:13,color:'#374151',border:'1px solid #e5e7eb'}},
            e('div',{style:{fontWeight:'bold',fontSize:11,color:'#6b7280',textTransform:'uppercase',marginBottom:4}},'Ausgangsposition'),
            e('p',{style:{margin:'0 0 8px'}},DETAILS[ex.name].pos),
            e('div',{style:{fontWeight:'bold',fontSize:11,color:'#6b7280',textTransform:'uppercase',marginBottom:4}},'Ausführung'),
            e('p',{style:{margin:'0 0 8px'}},DETAILS[ex.name].exec),
            e('div',{style:{background:'#fef9c3',borderRadius:8,padding:'6px 10px',fontSize:12,color:'#713f12'}},'💡 '+DETAILS[ex.name].cue)
          )
        ),
        e('button',{onClick:nextSet,style:{width:'100%',background:day.color,color:'#fff',border:'none',borderRadius:14,padding:15,fontSize:17,fontWeight:'bold',cursor:'pointer',marginTop:8}},
          setIdx+1 < ex.sets ? `Satz ${setIdx+1} erledigt →`
            : exIdx+1 < total ? 'Nächste Übung →'
            : 'Zum Cooldown →')
      ),
      // COOLDOWN
      phase==='cooldown' && e('div',null,
        e('div',{style:{fontSize:18,fontWeight:'bold',marginBottom:10}},'❄️ Cooldown'),
        e('div',{style:{background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:12,padding:14,fontSize:14,color:'#166534',marginBottom:16}}, day.cooldown||'Ruhig ausatmen.'),
        e('button',{onClick:()=>setPhase('done'),style:{width:'100%',background:'#22c55e',color:'#fff',border:'none',borderRadius:14,padding:14,fontSize:16,fontWeight:'bold',cursor:'pointer'}},'Fertig! 🏆')
      )
    )
  );
}

      // Meta badges
      e('div',{style:{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}},
        day.duration>0 && e('span',{style:{background:day.light,color:day.color,border:'1px solid '+day.border,borderRadius:20,padding:'4px 12px',fontSize:13,fontWeight:'bold'}},'⏱ '+day.duration+' Min'),
        e('span',{style:{background:'#f3f4f6',color:'#374151',borderRadius:20,padding:'4px 12px',fontSize:13}},'🏋️ '+day.exercises.length+' Übungen')
      ),
      // Warmup
      day.warmup.length>0 && e('div',{style:{marginBottom:14}},
        e('div',{style:{fontSize:12,fontWeight:'bold',color:'#6b7280',textTransform:'uppercase',marginBottom:6}},'🔆 Aufwärmen'),
        day.warmup.map((w,i)=>e('div',{key:i,style:{background:'#f9fafb',borderRadius:8,padding:'8px 12px',marginBottom:5,fontSize:13,color:'#374151'}},'• '+w))
      ),
      // Exercises – all visible
      e('div',{style:{fontSize:12,fontWeight:'bold',color:'#6b7280',textTransform:'uppercase',marginBottom:8}},'🏃 Übungen'),
      e('div',{style:{display:'flex',flexDirection:'column',gap:7,marginBottom:14}},
        day.exercises.map((ex,i)=>e('div',{key:i,style:{background:'#fff',border:'1px solid '+(openEx===i?day.color:'#e5e7eb'),borderLeft:'4px solid '+day.color,borderRadius:10,overflow:'hidden'}},
          e('button',{onClick:()=>setOpenEx(openEx===i?null:i),style:{width:'100%',background:'none',border:'none',padding:'11px 12px',display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer',textAlign:'left'}},
            e('div',null,
              e('div',{style:{fontWeight:'bold',fontSize:14,color:'#1f2937'}},ex.name),
              e('div',{style:{fontSize:12,color:'#6b7280',marginTop:2}},
                (ex.sets>1?ex.sets+'× ':'')+ex.reps+(ex.weight!=='–'?' · ⚖️ '+ex.weight:''))
            ),
            e('span',{style:{color:day.color,fontSize:16}},openEx===i?'▲':'▼')
          ),
          openEx===i && DETAILS[ex.name] && e('div',{style:{padding:'0 12px 12px',fontSize:13,color:'#374151',borderTop:'1px solid '+day.border}},
            e('div',{style:{marginTop:10}},
              e('div',{style:{fontWeight:'bold',fontSize:11,color:'#6b7280',textTransform:'uppercase',marginBottom:3}},'Ausgangsposition'),
              e('p',{style:{margin:'0 0 8px'}},DETAILS[ex.name].pos),
              e('div',{style:{fontWeight:'bold',fontSize:11,color:'#6b7280',textTransform:'uppercase',marginBottom:3}},'Ausführung'),
              e('p',{style:{margin:'0 0 8px'}},DETAILS[ex.name].exec),
              e('div',{style:{background:'#fef9c3',borderRadius:8,padding:'7px 10px',fontSize:12,color:'#713f12'}},'💡 '+DETAILS[ex.name].cue)
            )
          )
        ))
      ),
      // Cooldown
      day.cooldown && e('div',{style:{marginBottom:14}},
        e('div',{style:{fontSize:12,fontWeight:'bold',color:'#6b7280',textTransform:'uppercase',marginBottom:6}},'❄️ Cooldown'),
        e('div',{style:{background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:10,padding:'10px 14px',fontSize:13,color:'#166534'}},day.cooldown)
      ),
      // Start button bottom
      day.duration>0 && e('button',{onClick:onStart,style:{width:'100%',background:day.color,color:'#fff',border:'none',borderRadius:14,padding:14,fontSize:16,fontWeight:'bold',cursor:'pointer',marginTop:4}},'▶ Geführtes Training starten')
    )
  );
}

// ─── HOME SCREEN ─────────────────────────────────────────────────────────────
function HomeScreen({onSelect}) {
  const [expanded, setExpanded] = useState(null);
  const todayRaw = new Date().getDay();
  const todayIdx = todayRaw === 0 ? 6 : todayRaw - 1;

  return e('div',{style:{display:'flex',flexDirection:'column',height:'100%'}},
    // App Header
    e('div',{style:{background:'#1f2937',color:'#fff',padding:'16px 16px 12px',flexShrink:0}},
      e('div',{style:{fontSize:20,fontWeight:'bold'}},'🏋️ Fitness Planer'),
      e('div',{style:{fontSize:13,color:'#9ca3af',marginTop:2}},'50+ · Rücken · Kraft · Kardio')
    ),
    e('div',{className:'scroll',style:{padding:'12px 12px 24px'}},
      // Today Banner
      e('div',{style:{background:DAYS[todayIdx].color,color:'#fff',borderRadius:16,padding:'14px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}},
        e('div',null,
          e('div',{style:{fontSize:12,opacity:0.85}},'Heute · '+DAYS[todayIdx].full),
          e('div',{style:{fontSize:18,fontWeight:'bold'}},DAYS[todayIdx].icon+' '+DAYS[todayIdx].focus),
          e('div',{style:{fontSize:13,opacity:0.85,marginTop:2}},DAYS[todayIdx].duration>0?DAYS[todayIdx].duration+' Min':'Ruhetag')
        ),
        DAYS[todayIdx].duration>0 && e('button',{onClick:()=>onSelect(todayIdx,'detail'),style:{background:'rgba(255,255,255,0.25)',color:'#fff',border:'2px solid rgba(255,255,255,0.5)',borderRadius:20,padding:'10px 16px',fontWeight:'bold',fontSize:14,cursor:'pointer'}},'Ansehen')
      ),
      // Week list
      e('div',{style:{fontSize:14,fontWeight:'bold',color:'#374151',marginBottom:8}},'Wochenplan'),
      e('div',{style:{display:'flex',flexDirection:'column',gap:6}},
        DAYS.map((d,i)=>e('div',{key:i,style:{background:'#fff',border:'1px solid '+(expanded===i?d.color:d.border),borderLeft:'4px solid '+d.color,borderRadius:12,overflow:'hidden'}},
          // Row
          e('div',{style:{display:'flex',alignItems:'center'}},
            // Expand toggle (▼/▲)
            e('button',{onClick:()=>setExpanded(expanded===i?null:i),style:{flex:1,background:'none',border:'none',padding:'11px 12px',display:'flex',alignItems:'center',gap:10,cursor:'pointer',textAlign:'left'}},
              e('span',{style:{fontSize:20}},d.icon),
              e('div',{style:{flex:1}},
                e('div',{style:{display:'flex',alignItems:'center',gap:6}},
                  e('span',{style:{fontWeight:'bold',fontSize:14,color:'#1f2937'}},d.full),
                  i===todayIdx && e('span',{style:{background:d.color,color:'#fff',borderRadius:20,padding:'1px 7px',fontSize:10,fontWeight:'bold'}},'Heute')
                ),
                e('div',{style:{fontSize:12,color:'#6b7280'}},d.focus+(d.duration>0?' · '+d.duration+' Min':''))
              ),
              e('span',{style:{color:'#9ca3af',fontSize:13,marginRight:4}},expanded===i?'▲':'▼')
            ),
            // Start arrow (►)
            d.duration>0 && e('button',{onClick:()=>onSelect(i,'workout'),style:{background:d.color,color:'#fff',border:'none',width:44,alignSelf:'stretch',fontSize:20,cursor:'pointer',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}},'›')
          ),
          // Expanded exercise list
          expanded===i && e('div',{style:{borderTop:'1px solid '+d.border,background:d.light,padding:'10px 12px'}},
            d.warmup.length>0 && e('div',{style:{marginBottom:8}},
              e('div',{style:{fontSize:11,fontWeight:'bold',color:'#6b7280',textTransform:'uppercase',marginBottom:4}},'Aufwärmen'),
              d.warmup.map((w,j)=>e('div',{key:j,style:{fontSize:12,color:'#4b5563',marginBottom:2}},'• '+w))
            ),
            e('div',{style:{fontSize:11,fontWeight:'bold',color:'#6b7280',textTransform:'uppercase',marginBottom:5}},'Übungen'),
            d.exercises.map((ex,j)=>e('div',{key:j,style:{display:'flex',justifyContent:'space-between',alignItems:'center',background:'#fff',borderRadius:8,padding:'7px 10px',marginBottom:5,fontSize:13}},
              e('span',{style:{color:'#1f2937',fontWeight:'500'}},ex.name),
              e('span',{style:{color:'#6b7280',fontSize:12,marginLeft:8,whiteSpace:'nowrap'}},(ex.sets>1?ex.sets+'× ':'')+ex.reps)
            )),
            d.duration>0 && e('div',{style:{display:'flex',gap:8,marginTop:8}},
              e('button',{onClick:()=>onSelect(i,'detail'),style:{flex:1,background:'#fff',color:d.color,border:'1px solid '+d.color,borderRadius:10,padding:'9px',fontSize:13,fontWeight:'bold',cursor:'pointer'}},'Details →'),
              e('button',{onClick:()=>onSelect(i,'workout'),style:{flex:1,background:d.color,color:'#fff',border:'none',borderRadius:10,padding:'9px',fontSize:13,fontWeight:'bold',cursor:'pointer'}},'▶ Starten')
            )
          )
        ))
      ),
      // Tips
      e('div',{style:{background:'#fffbeb',border:'1px solid #fde68a',borderRadius:12,padding:12,marginTop:14}},
        e('div',{style:{fontWeight:'bold',fontSize:13,color:'#92400e',marginBottom:6}},'⚡ Wichtig'),
        ['Bei akutem Hexenschuss pausieren – erst nach Abklingen trainieren.',
         'Rudermaschine: Immer Beine zuerst, nicht mit dem Rücken reißen.',
         'Stechender Schmerz → sofort aufhören.'].map((t,i)=>
          e('div',{key:i,style:{fontSize:12,color:'#78350f',marginBottom:4,paddingLeft:8,borderLeft:'2px solid #fbbf24'}},'• '+t)
        )
      )
    )
  );
}

// ─── ROOT APP ────────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('home'); // home | detail | workout
  const [selIdx, setSelIdx] = useState(0);

  function goTo(idx, scr) { setSelIdx(idx); setScreen(scr); }

  return e('div',{className:'app'},
    screen==='home'    && e(HomeScreen,   {onSelect:goTo}),
    screen==='detail'  && e(DayDetail,    {day:DAYS[selIdx], onBack:()=>setScreen('home'), onStart:()=>setScreen('workout')}),
    screen==='workout' && e(WorkoutScreen,{day:DAYS[selIdx], onBack:()=>setScreen('home')})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
